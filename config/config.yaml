data_sources:
  pilelog:
    type: "multi_excel"
    required_columns:
      - "Pile Number"
      - "Date"
      - "Auger"
      - "Drill Depth"
      - "Rock Depth"
      - "SED/Beam"
      - "SED/Beam Length"
      - "Concrete Pump"
      - "Sleeve"
      - "Actual Rock"
      - "Calc Conc"
    table_name: "combined_pilelog_data"
    upload_mode: "overwrite"
    output_path: "data/processed/combined_pilelog_data.csv"

  job_data:
    type: "excel"
    file_path: "data/raw/5 Jobs Data.xlsx"
    required_columns:
      - Address
      - City
      - Estimator
      - Estimator Email
      - First Received Date
      - Foreman
      - Foreman Email
      - Foreman Phone
      - Job Area
      - Job Description
      - Job Name
      - Job Number
      - Job Value
      - Main Contractor
      - Onsite Finish
      - Onsite Start
      - Suburb
      - Successful Date
      - Supervisor
      - Supervisor Email
      - Supervisor Phone
      - unique id
    table_name: "job_data"
    upload_mode: "overwrite"
    batch_size: 20

  plant_equipment:
    type: "csv"
    file_path: "data/raw/plant and equipment list.csv"
    required_columns:
      - Asset Code
      - Asset Serial
      - Asset Type
      - Display Name
      - Fuel Type
      - Groups/Fleets
      - Machine Type
      - Make
      - Model
      - Registration Plate
      - VIN
      - Weight Type
      - Year
    table_name: "plant_and_equipment_list"
    upload_mode: "overwrite"
    batch_size: 20

  concrete_type:
    type: "csv"
    file_path: "data/raw/concrete type.csv"
    required_columns:
      - Product Code
      - Product Description
      - Product Type
    table_name: "concrete_type"
    upload_mode: "overwrite"
    batch_size: 50

  claim:
    type: "multi_excel"
    files_config: "claim_files.yaml"
    table_name: "combined_claim_data"
    upload_mode: "overwrite"
    batch_size: 100

  lentune_invoices:
    type: "csv"
    file_path: "data/raw/Lentune_Invoice_Data - adding month.csv"
    required_columns:
      - Categories
      - Checked Date
      - First Approved Date
      - Invoice Number
      - Line Cost Code
      - Line Description
      - Line Excluding
      - Line Including
      - Line Price
      - Line Project
      - Line Quantity
      - Line Tax
      - Processed Date
      - Second Approved Date
      - Status
      - Supplier Description
      - Transaction Date
    table_name: "lentune_invoices_data"
    upload_mode: "append" # APPEND mode for invoices
    batch_size: 500

  month_end_data:
    type: "excel"
    file_path: "data/raw/financial report table - adding month.xlsx"
    table_name: "month_end_data"
    upload_mode: "append" # APPEND mode for monthly reports
    batch_size: 50

  programme_data:
    type: "excel"
    file_path: "data/raw/programme data - adding month.xlsx"
    table_name: "programme_data"
    upload_mode: "append" # APPEND mode for programme data
    batch_size: 25

  categories_breakdown_data:
    type: "excel"
    file_path: "data/raw/categories breakdown data - adding month.xlsx"
    table_name: "categories_breakdown_data"
    upload_mode: "append"
    batch_size: 50

  quotation_data:
    type: "csv"
    file_path: "data/raw/Combined_Quotation - adding month.csv"
    table_name: "combined_quotation_data"
    upload_mode: "append"
    batch_size: 100

  internal_plant_cost:
    type: "csv"
    file_path: "data/raw/Internal_Plant_Cost - adding month.csv"
    table_name: "internal_plant_cost"
    upload_mode: "append"
    batch_size: 100

  workshop_cost:
    type: "csv"
    file_path: "data/raw/Workshop_Cost - adding month.csv"
    table_name: "workshop_cost_data"
    upload_mode: "append"
    batch_size: 10

  company_cost:
    type: "csv"
    file_path: "data/raw/Company_Cost - adding month.csv"
    table_name: "company_cost_data"
    upload_mode: "append"
    batch_size: 500

upload:
  batch_size: 500
  fill_na: true
